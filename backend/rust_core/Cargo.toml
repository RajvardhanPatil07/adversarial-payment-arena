[package]
name = "arena-core"
version = "0.1.0"
edition = "2021"
description = "Rust hot-path state for Adversarial Payment Arena"
license = "MIT"

[lib]
name = "arena_core"
crate-type = ["cdylib"]

[dependencies]
# Maturin >=1.9.4 sets PYO3_BUILD_EXTENSION_MODULE only for distribution
# builds. Keeping `extension-module` out of the crate features lets normal
# `cargo test` link libpython correctly while wheel builds remain manylinux-safe.
# Pin the direct dependency so CI/container rebuilds do not silently move to a
# newer PyO3 minor/patch with different Python/Rust ABI behavior.
pyo3 = { version = "=0.29.2", features = ["abi3-py39"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

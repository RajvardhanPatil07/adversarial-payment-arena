name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Scale validation is intentionally fast enough to run on every PR head.
# The benchmark harness itself still supports 100M transactions for explicit
# network-scale evidence runs, but ordinary CI validates the exact same paths
# at 1M so iteration does not spend hours on superseded commits.
# PR branches are validated by pull_request only; main keeps push validation.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-python:
    name: Backend (Python fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend regressions
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_defense.py
          tests/test_main.py
          tests/test_realtime_backend.py
          tests/test_batch_decision.py
          tests/test_threat_miner.py
          tests/test_graph_risk.py
          tests/test_challenger_containment.py
          tests/test_feedback_adapter.py

      - name: Run deterministic multi-vector attack trace
        env:
          PYTHONPATH: backend
          OPENROUTER_API_KEY: ""
          ENABLE_SHADOW_CHALLENGER: "false"
        run: |
          python backend/run_campaign.py \
            --attack attack_2 \
            --size 20 \
            --portfolio \
            --segment-size 4 \
            --max-vectors 4 \
            --feedback-mode gray \
            --fast | tee /tmp/red-team-portfolio-trace.jsonl

      - name: Validate and summarize red-team trace
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          trace_path = Path('/tmp/red-team-portfolio-trace.jsonl')
          events = []
          non_json = []
          for line in trace_path.read_text(encoding='utf-8').splitlines():
              try:
                  events.append(json.loads(line))
              except json.JSONDecodeError:
                  non_json.append(line)

          counts = Counter(str(event.get('type')) for event in events)
          starts = [event for event in events if event.get('type') == 'vector_segment_start']
          decisions = [event for event in events if event.get('type') == 'defense_decision']
          transitions = [event for event in events if event.get('type') == 'strategy_transition']
          summaries = [event for event in events if event.get('type') == 'portfolio_campaign_summary']
          errors = [event for event in events if event.get('type') == 'error']

          if errors:
              raise SystemExit(f'campaign emitted errors: {errors}')
          if len(summaries) != 1:
              raise SystemExit(f'expected exactly one portfolio summary, got {len(summaries)}')

          portfolio = summaries[0]['data']
          strategy = portfolio['strategy']
          visited = strategy['visited']
          if len(visited) < 2:
              raise SystemExit(
                  'portfolio never activated a second vector; the end-to-end pivot path was not exercised'
              )
          if not any(row['data']['action'] == 'pivot' for row in transitions):
              raise SystemExit('portfolio emitted no pivot transition')
          if not decisions:
              raise SystemExit('campaign emitted no Blue-Team decisions')

          decision_rows = [
              {
                  'txn_index': event.get('txn_index'),
                  'segment': event.get('segment'),
                  'vector_spec': event.get('vector_spec'),
                  'decision': event.get('decision'),
                  'reasons': event.get('reasons', []),
                  'amount': event.get('amount'),
                  'scores': event.get('scores', {}),
              }
              for event in decisions
          ]
          transition_rows = [
              {
                  'segment': event.get('segment'),
                  **event.get('data', {}),
              }
              for event in transitions
          ]
          segment_rows = [event.get('data', {}) for event in starts]

          summary = {
              'scenario': {
                  'initial_attack': 'ATTACK_2_SYNTHETIC_MULE_RING',
                  'slots_budgeted': 20,
                  'segment_size': 4,
                  'max_vectors': 4,
                  'feedback_mode': 'gray',
                  'offline_deterministic': True,
              },
              'event_counts': dict(counts),
              'non_json_lines': non_json,
              'segments': segment_rows,
              'decisions': decision_rows,
              'transitions': transition_rows,
              'final_portfolio_summary': portfolio,
          }
          Path('/tmp/red-team-portfolio-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          print(json.dumps({
              'visited_vectors': visited,
              'unique_vectors': strategy['unique_vectors'],
              'slots_consumed': portfolio['slots_consumed'],
              'stopped_reason': portfolio['stopped_reason'],
              'decision_counts': dict(Counter(row['decision'] for row in decision_rows)),
              'transitions': transition_rows,
          }, indent=2))
          PY

      - name: Upload red-team portfolio trace
        uses: actions/upload-artifact@v4
        with:
          name: red-team-portfolio-trace
          path: |
            /tmp/red-team-portfolio-trace.jsonl
            /tmp/red-team-portfolio-summary.json
          if-no-files-found: error

  model-sweep:
    name: Fraud model quality + throughput sweep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compare tabular, graph-augmented and novelty candidates
        env:
          PYTHONPATH: backend
        run: >-
          python backend/benchmarks/benchmark_model_sweep.py
          --json /tmp/model-sweep.json
      - name: Upload model sweep
        uses: actions/upload-artifact@v4
        with:
          name: model-sweep
          path: /tmp/model-sweep.json
          if-no-files-found: error

  rust-core:
    name: Rust feature + graph core, parity + benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Rust formatting
        run: |
          cargo fmt --manifest-path backend/rust_core/Cargo.toml -- --check
          cargo fmt --manifest-path backend/rust_graph_core/Cargo.toml -- --check
      - name: Rust lint
        run: |
          cargo clippy --manifest-path backend/rust_core/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path backend/rust_graph_core/Cargo.toml --all-targets -- -D warnings
      - name: Rust unit tests
        run: |
          cargo test --manifest-path backend/rust_core/Cargo.toml
          cargo test --manifest-path backend/rust_graph_core/Cargo.toml
      - name: Build native wheels and install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt "maturin>=1.9.4,<2"
          mkdir -p /tmp/arena-wheels
          maturin build --release --manifest-path backend/rust_core/Cargo.toml --interpreter python3 --out /tmp/arena-wheels
          maturin build --release --manifest-path backend/rust_graph_core/Cargo.toml --interpreter python3 --out /tmp/arena-wheels
          python -m pip install /tmp/arena-wheels/*.whl
      - name: Verify native/Python feature, graph and batch parity
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest -q
          backend/tests/test_realtime_backend.py
          backend/tests/test_graph_risk.py
          backend/tests/test_batch_decision.py
      - name: Benchmark Python vs Rust baseline (12k/workload)
        env:
          PYTHONPATH: backend
        run: >-
          python backend/benchmarks/benchmark_feature_state.py
          --events 12000
          --repeats 3
          --maxlen 500
          --json /tmp/feature-state-benchmark-baseline.json
      - name: High-volume Rust scale test (500k/workload)
        env:
          PYTHONPATH: backend
        run: >-
          python backend/benchmarks/benchmark_feature_state.py
          --events 500000
          --repeats 1
          --maxlen 10000
          --native-only
          --json /tmp/feature-state-benchmark-500k.json
      - name: PR-scale Rust feature-state test (1M mixed transactions)
        env:
          PYTHONPATH: backend
        run: >-
          python backend/benchmarks/benchmark_feature_state.py
          --events 1000000
          --repeats 1
          --maxlen 10000
          --chunk-size 50000
          --workloads mixed
          --native-only
          --fused
          --json /tmp/feature-state-benchmark-1m-mixed.json
      - name: Full analysis scale test (1M transactions, Rust feature + graph state)
        env:
          PYTHONPATH: backend
        run: >-
          python backend/benchmarks/benchmark_full_stack.py
          --events 1000000
          --chunk-size 50000
          --customers 1000
          --maxlen 10000
          --event-retention 50000
          --json /tmp/full-stack-benchmark-1m.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: scale-benchmarks
          path: |
            /tmp/feature-state-benchmark-*.json
            /tmp/full-stack-benchmark-*.json
          if-no-files-found: error

  container-smoke:
    name: Production container + native runtime
    needs: [backend-python, model-sweep, rust-core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag adversarial-payment-arena:ci .
      - name: Boot production image
        run: docker run --detach --name arena-ci --publish 8000:8000 adversarial-payment-arena:ci
      - name: Verify health and both native backends
        run: |
          rm -f /tmp/arena-health.json
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health > /tmp/arena-health.json; then
              break
            fi
            sleep 2
          done
          test -s /tmp/arena-health.json
          cat /tmp/arena-health.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('/tmp/arena-health.json').read_text())
          assert health['status'] == 'ok', health
          assert health['feature_backend'] == 'rust', health
          assert health['graph_backend'] == 'rust', health
          assert health['challenger']['controls_live_authorizations'] is False, health
          PY
      - name: Print container logs on failure
        if: failure()
        run: docker logs arena-ci || true
      - name: Stop container
        if: always()
        run: docker rm --force arena-ci || true
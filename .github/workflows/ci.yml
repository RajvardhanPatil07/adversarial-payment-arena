name: CI

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:

permissions:
  contents: read

jobs:
  backend-python:
    name: Backend (Python fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend regressions
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_defense.py
          tests/test_main.py
          tests/test_realtime_backend.py
          tests/test_batch_decision.py

  rust-core:
    name: Rust core + Python parity + benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Rust formatting
        run: cargo fmt --manifest-path backend/rust_core/Cargo.toml -- --check
      - name: Rust lint
        run: cargo clippy --manifest-path backend/rust_core/Cargo.toml --all-targets -- -D warnings
      - name: Rust unit tests
        run: cargo test --manifest-path backend/rust_core/Cargo.toml
      - name: Build native wheel and install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt "maturin>=1.9.4,<2"
          maturin build --release --manifest-path backend/rust_core/Cargo.toml --interpreter python3 --out /tmp/arena-wheels
          python -m pip install /tmp/arena-wheels/*.whl
      - name: Verify native/Python feature and batch-decision parity
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest -q
          backend/tests/test_realtime_backend.py
          backend/tests/test_batch_decision.py
      - name: Benchmark Python vs Rust baseline (12k/workload)
        env:
          PYTHONPATH: backend
        run: >-
          python backend/benchmarks/benchmark_feature_state.py
          --events 12000
          --repeats 3
          --maxlen 500
          --json /tmp/feature-state-benchmark-baseline.json
      - name: High-volume Rust scale test (500k/workload)
        env:
          PYTHONPATH: backend
        run: >-
          python backend/benchmarks/benchmark_feature_state.py
          --events 500000
          --repeats 1
          --maxlen 10000
          --native-only
          --json /tmp/feature-state-benchmark-500k.json
      - name: Network-scale Rust feature-state test (100M mixed transactions)
        env:
          PYTHONPATH: backend
        run: >-
          python backend/benchmarks/benchmark_feature_state.py
          --events 100000000
          --repeats 1
          --maxlen 10000
          --chunk-size 50000
          --workloads mixed
          --native-only
          --json /tmp/feature-state-benchmark-100m-mixed.json
      - name: Full analysis scale test (100M transactions)
        env:
          PYTHONPATH: backend
        run: >-
          python backend/benchmarks/benchmark_full_stack.py
          --events 100000000
          --chunk-size 50000
          --customers 1000
          --maxlen 10000
          --event-retention 50000
          --json /tmp/full-stack-benchmark-100m.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: scale-benchmarks
          path: |
            /tmp/feature-state-benchmark-*.json
            /tmp/full-stack-benchmark-*.json
          if-no-files-found: error

  container-smoke:
    name: Production container + native runtime
    needs: [backend-python, rust-core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag adversarial-payment-arena:ci .
      - name: Boot production image
        run: docker run --detach --name arena-ci --publish 8000:8000 adversarial-payment-arena:ci
      - name: Verify health and native backend
        run: |
          rm -f /tmp/arena-health.json
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health > /tmp/arena-health.json; then
              break
            fi
            sleep 2
          done
          test -s /tmp/arena-health.json
          cat /tmp/arena-health.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('/tmp/arena-health.json').read_text())
          assert health['status'] == 'ok', health
          assert health['feature_backend'] == 'rust', health
          PY
      - name: Print container logs on failure
        if: failure()
        run: docker logs arena-ci || true
      - name: Stop container
        if: always()
        run: docker rm --force arena-ci || true

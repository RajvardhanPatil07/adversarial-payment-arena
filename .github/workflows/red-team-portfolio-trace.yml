name: Red-Team Portfolio Trace

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: red-team-trace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portfolio-trace:
    name: Deterministic multi-vector attack trace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run deterministic multi-vector campaign
        env:
          PYTHONPATH: backend
          OPENROUTER_API_KEY: ""
          ENABLE_SHADOW_CHALLENGER: "false"
        run: |
          python backend/run_campaign.py \
            --attack attack_2 \
            --size 20 \
            --portfolio \
            --segment-size 4 \
            --max-vectors 4 \
            --feedback-mode gray \
            --fast | tee /tmp/red-team-portfolio-trace.jsonl

      - name: Validate and summarize trace
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          trace_path = Path('/tmp/red-team-portfolio-trace.jsonl')
          events = []
          non_json = []
          for line in trace_path.read_text(encoding='utf-8').splitlines():
              try:
                  events.append(json.loads(line))
              except json.JSONDecodeError:
                  non_json.append(line)

          counts = Counter(str(event.get('type')) for event in events)
          starts = [event for event in events if event.get('type') == 'vector_segment_start']
          decisions = [event for event in events if event.get('type') == 'defense_decision']
          transitions = [event for event in events if event.get('type') == 'strategy_transition']
          summaries = [event for event in events if event.get('type') == 'portfolio_campaign_summary']
          errors = [event for event in events if event.get('type') == 'error']

          if errors:
              raise SystemExit(f'campaign emitted errors: {errors}')
          if len(summaries) != 1:
              raise SystemExit(f'expected exactly one portfolio summary, got {len(summaries)}')

          portfolio = summaries[0]['data']
          strategy = portfolio['strategy']
          visited = strategy['visited']
          if len(visited) < 2:
              raise SystemExit(
                  'portfolio never activated a second vector; the end-to-end pivot path was not exercised'
              )
          if not any(row['data']['action'] == 'pivot' for row in transitions):
              raise SystemExit('portfolio emitted no pivot transition')
          if not decisions:
              raise SystemExit('campaign emitted no Blue-Team decisions')

          decision_rows = [
              {
                  'txn_index': event.get('txn_index'),
                  'segment': event.get('segment'),
                  'vector_spec': event.get('vector_spec'),
                  'decision': event.get('decision'),
                  'reasons': event.get('reasons', []),
                  'amount': event.get('amount'),
                  'scores': event.get('scores', {}),
              }
              for event in decisions
          ]
          transition_rows = [
              {
                  'segment': event.get('segment'),
                  **event.get('data', {}),
              }
              for event in transitions
          ]
          segment_rows = [event.get('data', {}) for event in starts]

          summary = {
              'scenario': {
                  'initial_attack': 'ATTACK_2_SYNTHETIC_MULE_RING',
                  'slots_budgeted': 20,
                  'segment_size': 4,
                  'max_vectors': 4,
                  'feedback_mode': 'gray',
                  'offline_deterministic': True,
              },
              'event_counts': dict(counts),
              'non_json_lines': non_json,
              'segments': segment_rows,
              'decisions': decision_rows,
              'transitions': transition_rows,
              'final_portfolio_summary': portfolio,
          }
          Path('/tmp/red-team-portfolio-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          print(json.dumps({
              'visited_vectors': visited,
              'unique_vectors': strategy['unique_vectors'],
              'slots_consumed': portfolio['slots_consumed'],
              'stopped_reason': portfolio['stopped_reason'],
              'decision_counts': dict(Counter(row['decision'] for row in decision_rows)),
              'transitions': transition_rows,
          }, indent=2))
          PY

      - name: Upload reproducible red-team trace
        uses: actions/upload-artifact@v4
        with:
          name: red-team-portfolio-trace
          path: |
            /tmp/red-team-portfolio-trace.jsonl
            /tmp/red-team-portfolio-summary.json
          if-no-files-found: error
